<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03050c" />
    <meta
      name="description"
      content="在线体验栗子软件科技交互方案原型：序章·运营工作台、知间·知识 Agent 与有序·审批工作流。"
    />
    <title>方案原型体验 — 栗子软件科技</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" src="./src/pages/project.ts"></script>
  </head>
  <body class="bg-[#03050c] text-slate-100 antialiased">
    <!-- SITE_HEADER -->

    <main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-20 lg:pt-12">
      <!-- 顶部返回与方案切换条 -->
      <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800/80">
        <a href="work.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-300 hover:text-sky-400 transition-colors">
          <span aria-hidden="true">←</span>
          <span>返回解决方案</span>
        </a>

        <div class="flex flex-wrap items-center gap-2" role="group" aria-label="切换解决方案原型">
          <button type="button" data-concept-switch="operations" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors bg-blue-600 text-white shadow-lg shadow-blue-600/30">序章 · 运营工作台</button>
          <button type="button" data-concept-switch="agent" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors bg-slate-900/80 border border-slate-800 text-slate-300 hover:border-slate-600 hover:text-white">知间 · 知识 Agent</button>
          <button type="button" data-concept-switch="workflow" class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-colors bg-slate-900/80 border border-slate-800 text-slate-300 hover:border-slate-600 hover:text-white">有序 · 审批工作流</button>
        </div>
      </div>

      <!-- 方案标题区 -->
      <section aria-labelledby="project-title" class="pt-8 pb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/85 border border-slate-700/80 text-xs font-semibold text-sky-400">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
          <span id="project-category">企业软件</span>
        </div>
        <h1 id="project-title" class="mt-3 text-3xl sm:text-4xl font-bold tracking-tight text-white">
          序章 · 运营工作台
        </h1>
        <p id="project-description" class="mt-3 text-base text-slate-400 leading-relaxed max-w-2xl"></p>
      </section>

      <!-- 激光流光边框交互演示应用窗口 -->
      <section id="experience" aria-label="交互原型演示">
        <div class="laser-border rounded-2xl p-[1px]">
          <div class="laser-border-inner rounded-[15px] overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[460px]">
            <aside class="lg:col-span-3 bg-[#050814]/90 border-b lg:border-b-0 lg:border-r border-slate-800/80 p-4 sm:p-5 flex flex-col justify-between gap-4">
              <div>
                <div class="flex items-center gap-2.5 pb-4 border-b border-slate-800/80">
                  <span id="demo-brand-icon" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 text-white text-sm font-bold shadow-md shadow-blue-500/25">序</span>
                  <div>
                    <p id="demo-brand-name" class="text-sm font-bold text-white">序章</p>
                    <p class="text-[11px] font-mono text-sky-400">INTERACTIVE PROTOTYPE</p>
                  </div>
                </div>
                <div id="demo-tabs" role="tablist" aria-label="原型页面视图" class="mt-4 grid grid-cols-3 lg:grid-cols-1 gap-1.5"></div>
              </div>
              <p class="hidden lg:block text-xs text-slate-500 leading-relaxed">
                在线前端交互沙盒，内置示例业务数据，切换方案可联动底层 3D 粒子场形态。
              </p>
            </aside>

            <div class="lg:col-span-9 flex flex-col bg-[#080D1C]/85">
              <div class="px-5 py-3.5 border-b border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <span id="demo-breadcrumb" class="font-medium text-slate-200">演示空间 / 项目总览</span>
                <span class="font-mono text-[11px] text-sky-400">SANDBOX · LIVE</span>
              </div>
              <div id="demo-view" role="tabpanel" tabindex="0" aria-live="polite" class="p-5 sm:p-7 flex-1"></div>
            </div>
          </div>
        </div>
        <p class="mt-3 text-xs text-slate-500">
          说明：本窗口展示前端交互设计与业务流程逻辑，所有数据均为示例内容，不连接外部生产系统。
        </p>
      </section>

      <!-- 方案思路与交付范围 -->
      <section aria-labelledby="context-title" class="mt-16 pt-12 border-t border-slate-800/80">
        <div class="max-w-3xl">
          <p class="text-xs font-mono uppercase tracking-widest text-sky-400">ARCHITECTURAL DESIGN</p>
          <h2 id="context-title" class="mt-2 text-2xl sm:text-3xl font-bold text-white"></h2>
          <p id="context-copy" class="mt-3 text-base text-slate-400 leading-relaxed"></p>
        </div>
        <div id="approach-steps" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </section>

      <section aria-labelledby="scope-title" class="mt-16 pt-12 border-t border-slate-800/80">
        <h2 id="scope-title" class="text-2xl font-bold text-white">原型可体验部分与实际交付范围</h2>
        <div id="scope-list" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-5"></div>
      </section>

      <!-- 底部咨询与下一方案 -->
      <section aria-labelledby="project-consult-title" class="mt-16">
        <div class="laser-border rounded-2xl p-[1px]">
          <div class="laser-border-inner rounded-[15px] p-6 sm:p-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
              <h2 id="project-consult-title" class="text-xl sm:text-2xl font-bold text-white">需要基于类似结构定制开发？</h2>
              <p class="mt-2 text-sm text-slate-400">可以带着贵司实际业务规则与现有表格，与我们一起评估方案与周期。</p>
            </div>
            <div class="flex flex-wrap items-center gap-3 shrink-0">
              <a id="project-brief-link" href="about.html?service=software#contact" class="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-colors">
                咨询此方案 →
              </a>
              <a id="next-project-link" href="project.html?project=agent" class="px-5 py-3 rounded-xl bg-slate-900/85 hover:bg-slate-800 border border-slate-700/80 text-slate-200 text-sm font-semibold transition-colors">
                下一个方案 →
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- SITE_FOOTER -->
  </body>
</html>
